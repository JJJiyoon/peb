<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 학습 활동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  /* =====================================================================
     컨셉: 교실 칠판
     - 노란 벽, 책장, 책상 사이에 나무 틀 초록 칠판이 있다.
     - 왼쪽은 짧은 칠판 글, 오른쪽은 넓은 학습지.
     - 글씨는 Noto Sans KR, 없으면 맑은 고딕.
     ===================================================================== */
  :root{
    color-scheme: light;
    --bg-a:#f6e4bc;
    --bg-b:#f3ddb0;
    --sheet:#fffaf0;
    --white:#fffcf8;
    --ink:#1a2332;
    --muted:#5e6878;
    --navy:#1b3352;
    --navy-soft:#e7eef6;
    --line:rgba(27,51,82,.12);
    --line-strong:rgba(27,51,82,.22);
    --board:#3e5248;
    --board-2:#35483f;
    --cream:#f7f3ea;
    --chalk:#f7f3e8;
    --paper:#f7f3ea;
    --ink-title:#243028;
    --coral:#b55245;
    --coral-soft:#f8ece8;
    --moss:#2c6b4e;
    --moss-soft:#e7f3ec;
    --wood:#e7c98a;
    --wood-dark:#c4924e;
    --shadow:0 22px 40px rgba(92,62,24,.16);
    --radius:14px;
    --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --serif:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --title:clamp(30px, 2.8vw, 36px);
  }
  *{box-sizing:border-box;}
  html,body{height:auto; min-height:100%; overflow-x:hidden; overflow-y:auto;}
  body{
    margin:0;
    font-family:var(--sans);
    font-size:30px;
    color:var(--ink);
    background:var(--board);
  }
  button,input,textarea{font-family:inherit; color:inherit;}
  button{margin:0;}
  p,h1,h2{margin:0;}
  ::selection{background:#d7e4f3;}

  .app-bg{
    min-height:100dvh;
    height:auto;
    display:block;
    padding:0;
    position:relative;
    overflow:visible;
    background:var(--board);
  }
  .room-shelf,.room-plant,.room-desk{display:none;}
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100dvh;
    height:auto;
    background:
      radial-gradient(80% 50% at 50% 0%, rgba(255,255,255,.08), transparent 42%),
      linear-gradient(180deg, #4a6156 0%, var(--board) 28%, var(--board-2));
    color:var(--chalk);
    border:0;
    border-radius:0;
    box-shadow:none;
    display:flex;
    flex-direction:column;
    overflow:visible;
  }

  .stage-head{
    flex:0 0 auto;
    position:sticky;
    top:0;
    z-index:8;
    background:linear-gradient(180deg, #4a6156 0%, var(--board) 70%);
    color:var(--chalk);
  }
  .stage-head-row{
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 26px 12px;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand strong{font-size:30px; letter-spacing:-.02em; white-space:nowrap; color:var(--chalk);}
  .section-name{
    color:rgba(247,243,232,.82);
    font-size:30px;
    font-weight:500;
    padding-left:12px;
    margin-left:2px;
    border-left:1px solid rgba(247,243,232,.4);
    white-space:nowrap;
  }
  .step{
    display:flex;
    align-items:baseline;
    gap:4px;
    font-variant-numeric:tabular-nums;
    color:rgba(247,243,232,.8);
    font-size:30px;
    flex:none;
  }
  .step b{color:var(--chalk); font-size:30px; font-weight:700;}
  .track{height:4px; background:rgba(255,255,255,.16);}
  .track span{display:block; height:100%; background:var(--chalk);}

  .stage-body{
    flex:1 0 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:14px 40px 28px;
    overflow:visible;
  }
  .screen{
    flex:1 0 auto;
    min-height:auto;
    overflow:visible;
    display:flex;
    flex-direction:column;
  }

  .stage-foot{
    flex:none;
    border-top:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.1);
    padding:14px 22px 16px;
  }
  .stage-foot:empty{display:none;}
  .navbar-inner{display:flex; align-items:center; gap:12px;}
  .spacer{flex:1;}
  .nav-hint{font-size:30px; color:#ffd2c8; font-weight:700;}
  .nav-hint:empty{display:none;}

  button{
    font-size:30px;
    font-weight:700;
    letter-spacing:-.01em;
    padding:12px 22px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:var(--white);
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .12s;
  }
  button[hidden]{display:none;}
  .stage-foot button.ghost{
    color:var(--chalk);
    border-color:rgba(247,243,232,.45);
    background:transparent;
  }
  button:hover:not(:disabled){border-color:rgba(27,51,82,.45);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:focus-visible,.opt:focus-visible,.scale-btn:focus-within{
    outline:3px solid rgba(27,51,82,.28);
    outline-offset:2px;
  }
  button.primary{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    min-width:112px;
  }
  button.primary:hover:not(:disabled){background:#243f64;}
  button.primary.is-waiting{background:#d5dde8; border-color:#d5dde8; color:#fff;}
  button.primary:disabled{background:#c5d0de; border-color:#c5d0de; color:#fff; cursor:not-allowed;}
  button.ghost{background:transparent;}
  button.ghost:disabled{opacity:.4; cursor:not-allowed;}

  .kicker{
    font-size:30px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--navy);
  }
  .lead{font-size:30px; line-height:1.7;}
  .small-note{margin-top:14px; font-size:30px; color:var(--muted); line-height:1.55;}

  .board{
    background:transparent;
    color:var(--chalk);
    border-radius:0;
    padding:12px 6px 8px 8px;
    display:flex;
    flex-direction:column;
    min-height:0;
    height:100%;
    box-shadow:none;
  }
  .board-kicker{color:rgba(247,243,232,.78); letter-spacing:.12em;}
  .board h1{
    margin-top:14px;
    font-family:var(--sans);
    font-weight:800;
    font-size:clamp(32px, 3.4vw, 46px);
    line-height:1.28;
    letter-spacing:-.03em;
    color:var(--chalk);
  }
  .board-lead{
    margin-top:16px;
    max-width:14em;
    font-size:30px;
    line-height:1.65;
    color:rgba(247,243,232,.9);
  }
  .board-character{margin-top:auto; padding-top:12px;}
  .board-character .character{width:128px; height:auto; display:block;}
  .board-foot{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .fact{
    background:rgba(255,255,255,.08);
    border-radius:14px;
    padding:12px 12px 11px;
  }
  .fact b{
    display:block;
    font-size:28px;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .fact span{display:block; margin-top:2px; font-size:30px; color:rgba(243,236,223,.8);}
  .chalk{width:min(100%,280px); margin-top:auto; margin-bottom:18px; display:block;}
  .giant-quote{
    margin:auto 0 0;
    font-family:var(--serif);
    font-size:148px;
    line-height:.72;
    color:rgba(243,236,223,.28);
  }

  .panel{
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:20px;
    min-height:0;
    min-width:0;
    box-shadow:0 8px 18px rgba(20,50,30,.08), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .form-panel,.write-panel,.prose{padding:22px 24px 18px; display:flex; flex-direction:column; gap:14px; height:100%; overflow:auto;}
  .form-panel h2,.write-panel h2,.prose h2{
    font-size:28px;
    letter-spacing:-.03em;
    line-height:1.4;
    font-weight:800;
  }
  .form-stack{display:flex; flex-direction:column; gap:12px; flex:1; min-height:0;}
  .form-note{
    margin-top:auto;
    background:var(--sheet);
    border-radius:14px;
    padding:14px 16px;
    color:var(--muted);
    font-size:30px;
    line-height:1.6;
  }
  .form-note.is-error{color:var(--coral);}
  .code-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .code-actions button{flex:1;}
  .admin-list{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px;}
  .admin-list b{font-variant-numeric:tabular-nums;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label,.field > span{font-size:30px; font-weight:700; color:var(--muted);}
  .field input[type=text], .field input[type=number], .answer-well input, textarea{
    width:100%;
    border:1px solid var(--line-strong);
    background:var(--white);
    border-radius:12px;
    padding:12px 14px;
    font-size:30px;
    line-height:1.5;
    outline:none;
  }
  .field input[type=text]{min-height:52px;}
  textarea{resize:none; min-height:140px;}
  .field input[type=text]:focus, .answer-well input:focus, textarea:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 4px rgba(27,51,82,.12);
  }
  .write-panel textarea{flex:1; min-height:180px;}
  .write-panel.is-compact textarea{
    flex:none;
    height:132px;
    min-height:0;
  }

  .screen-split{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(220px, .72fr) 1.7fr;
    gap:18px;
  }
  .screen-split > *{min-height:0;}
  .screen-stack{flex:1; min-height:0; gap:16px;}
  .screen-stack > .panel,
  .screen-stack > .choice-buttons{flex:1; min-height:0;}
  .stack-head{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:0 6px 8px;
    text-align:center;
    flex-wrap:wrap;
  }
  .stack-head > div:first-child{display:flex; flex-direction:column; align-items:center;}
  .stack-head h1,
  .quiz-head .question{
    margin-top:8px;
    font-weight:800;
    font-size:clamp(32px, 3.2vw, 44px);
    line-height:1.35;
    letter-spacing:-.03em;
    color:var(--ink-title);
    background:#fff;
    border:3px solid #2c3330;
    border-radius:999px;
    padding:14px 52px;
    box-shadow:0 3px 0 rgba(44,51,48,.08);
    display:inline-block;
    max-width:100%;
    white-space:nowrap;
    position:relative;
  }
  .stack-head h1::before,
  .stack-head h1::after,
  .quiz-head .question::before,
  .quiz-head .question::after{
    content:"";
    position:absolute;
    top:50%;
    width:12px;
    height:12px;
    margin-top:-6px;
    border-radius:50%;
    background:#2c3330;
  }
  .stack-head h1::before,
  .quiz-head .question::before{left:20px;}
  .stack-head h1::after,
  .quiz-head .question::after{right:20px;}
  .stack-lead{
    margin-top:12px;
    max-width:40em;
    font-size:30px;
    line-height:1.6;
    color:#3d4a44;
  }
  .stack-head .board-character{margin-top:0; padding-top:0;}
  .stack-head .character{width:112px;}
  .info-form .field{
    display:grid;
    grid-template-columns:148px minmax(0,1fr);
    align-items:center;
    gap:16px 20px;
  }
  .info-form .field label,
  .info-form .field > span{    font-size:30px; color:var(--ink);}
  .info-form .field input[type=text]{font-size:36px; min-height:64px;}
  .info-form .gender-btn{font-size:30px; min-height:64px;}

  .lesson-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:16px;
  }
  .lesson-grid > *{min-height:0;}
  .prose{overflow:auto; justify-content:flex-start;}
  .prose .lead{color:var(--ink);}

  .screen-stack,
  .screen-stories,
  .screen-quiz,
  .screen-scale,
  .screen-message{
    background:var(--paper);
    color:var(--ink);
    border-radius:28px;
    padding:22px 26px 18px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
  }
  .screen-message{
    align-items:center;
    justify-content:center;
    min-height:52vh;
  }
  .screen-stack > .panel{
    background:transparent;
    border:0;
    box-shadow:none;
  }
  .screen .kicker{
    display:inline-block;
    background:#f3d36b;
    color:#2a2a2a;
    border-radius:8px;
    padding:4px 14px;
    letter-spacing:0;
  }
  .screen-quiz,.screen-scale{flex:1 0 auto; min-height:auto; gap:20px; padding-bottom:28px;}
  .quiz-head{flex:none; padding:0 6px 8px; text-align:center;}
  .quiz-head .kicker{color:#2a2a2a;}
  .question{
    margin-top:8px;
    font-size:var(--title);
    line-height:1.45;
    letter-spacing:-.03em;
    font-weight:800;
    color:var(--ink-title);
  }
  .options{
    flex:0 0 auto;
    min-height:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    flex:0 0 auto;
    min-height:56px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    border-radius:14px;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line-strong);
    cursor:pointer;
    font-size:30px;
    line-height:1.45;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:rgba(27,51,82,.4);}
  .opt.selected{
    border-color:var(--navy);
    background:var(--navy-soft);
    box-shadow:inset 3px 0 0 var(--navy);
  }
  .opt.is-wrong{
    border-color:var(--coral);
    background:var(--coral-soft);
    box-shadow:inset 3px 0 0 var(--coral);
  }
  .letter{
    width:48px; height:48px; flex:none;
    display:grid; place-items:center;
    border-radius:50%;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--navy);
    font-size:30px;
    font-weight:700;
  }
  .opt.selected .letter{background:var(--navy); color:#fff; border-color:var(--navy);}
  .opt.is-wrong .letter{background:var(--coral); color:#fff; border-color:var(--coral);}

  .answer-well{
    flex:0 0 auto;
    min-height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:28px;
    padding:28px 28px 36px;
    text-align:center;
    color:var(--ink);
  }
  .answer-well input{
    flex:none;
    width:min(640px,100%);
    font-size:32px;
    text-align:center;
    letter-spacing:-.03em;
    min-height:76px;
    border-radius:16px;
  }

  .screen-message{min-height:0;}
  .message-panel{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    padding:42px 48px;
  }
  .goal-layout{
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:54px;
    text-align:left;
  }
  .goal-num{flex:none; min-width:180px;}
  .goal-num strong{
    display:block;
    font-family:var(--serif);
    font-weight:800;
    font-size:120px;
    line-height:.82;
    letter-spacing:-.04em;
    color:var(--navy);
  }
  .goal-num span{
    display:block;
    margin-top:10px;
    font-size:30px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .goal-copy{max-width:520px;}
  .goal-copy .lead{font-size:30px; line-height:1.6; letter-spacing:-.02em;}
  .message-panel.is-alert{align-items:center; text-align:center;}
  .message-panel .big{
    max-width:11em;
    font-family:var(--serif);
    font-weight:800;
    font-size:clamp(32px, 4vw, 48px);
    line-height:1.45;
    letter-spacing:-.03em;
    color:var(--coral);
  }
  .message-panel.is-alert .kicker{margin-bottom:18px;}

  .quote{
    flex:none;
    max-height:92px;
    overflow:auto;
    background:var(--navy-soft);
    border-radius:16px;
    padding:14px 16px;
    line-height:1.55;
  }
  .scale-list{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .likert-row{
    flex:1;
    min-height:84px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 16px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
  }
  .likert-sentence{flex:1; font-size:30px; line-height:1.5;}
  .likert-scale{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
  .scale-btn{
    position:relative;
    width:86px;
    min-height:64px;
    border-radius:14px;
    border:1px solid var(--line-strong);
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
  }
  .scale-btn input{position:absolute; opacity:0; pointer-events:none;}
  .scale-btn .n{font-size:30px; font-weight:750; color:var(--navy);}
  .scale-btn small{font-size:30px; font-weight:600; color:var(--muted); letter-spacing:-.03em;}
  .scale-btn:hover{border-color:rgba(27,51,82,.45);}
  .scale-btn:has(input:checked){background:var(--navy); border-color:var(--navy);}
  .scale-btn:has(input:checked) .n,
  .scale-btn:has(input:checked) small{color:#fff;}

  .choice-buttons{display:grid; grid-template-rows:1fr 1fr; gap:12px;}
  .choice-tile{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:8px;
    text-align:left;
    padding:26px 26px;
    border-radius:18px;
  }
  .choice-tile strong{font-size:28px; letter-spacing:-.03em; line-height:1.35;}
  .choice-tile span{font-size:30px; font-weight:500; line-height:1.5;}
  .choice-tile.primary span{color:rgba(255,255,255,.78);}
  .choice-tile.ghost{background:var(--white);}
  .choice-tile.ghost span{color:var(--muted);}

  .banner{
    flex:none;
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin-bottom:12px;
    padding:10px 12px;
    border-radius:14px;
    background:var(--navy-soft);
    max-height:78px;
    overflow:auto;
  }
  .banner .tag{
    flex:none;
    font-size:30px;
    font-weight:750;
    color:var(--navy);
    background:#fff;
    border-radius:999px;
    padding:4px 8px;
  }
  .banner p{font-size:30px; line-height:1.5; color:#24344d;}

  .tag-pill{
    display:inline-flex;
    align-items:center;
    margin-left:8px;
    padding:3px 8px;
    border-radius:999px;
    font-size:30px;
    font-weight:700;
    vertical-align:middle;
  }
  .tag-pill.wrong{background:var(--coral-soft); color:var(--coral);}
  .tag-pill.correct{background:var(--moss-soft); color:var(--moss);}
  .answer-compare{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .compare{
    border-radius:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    padding:28px;
  }
  .compare span{font-size:30px; font-weight:700;}
  .compare strong{font-size:clamp(28px, 3vw, 40px); letter-spacing:-.03em; line-height:1.2; word-break:break-word;}
  .compare.wrong{background:var(--coral-soft); color:var(--coral);}
  .compare.correct{background:var(--moss-soft); color:var(--moss);}

  .screen-end .board{flex:1;}
  .board-end{align-items:center; text-align:center;}
  .board-end .board-copy{margin:auto 0; display:flex; flex-direction:column; align-items:center;}
  .board-end .board-lead{margin-left:auto; margin-right:auto;}
  .board-end h1{font-size:clamp(40px, 5vw, 64px);}
  .books{display:flex; align-items:flex-end; gap:7px; margin-top:8px;}
  .books i{
    display:block;
    width:26px;
    border-radius:3px 3px 1px 1px;

// 마감시각을 기준으로 제한합니다. 탭을 숨겨도 시간이 흐르며 학생에게는 표시하지 않습니다.
function startPhase(name){
  const clock=phaseClocks[name];
  if(clock.start!==null) return;
  clock.start=Date.now();
  if(phaseTicker===null) phaseTicker=setInterval(checkPhaseDeadlines,250);
}
function stopPhase(name,at=Date.now(),timedOut=false){
  const clock=phaseClocks[name];
  if(clock.start===null || clock.end!==null) return;
  clock.end=Math.max(clock.start,Math.min(at,clock.start+clock.limit));
  clock.timedOut=timedOut;
  if(!Object.values(phaseClocks).some(c=>c.start!==null && c.end===null)){
    clearInterval(phaseTicker);phaseTicker=null;
  }
}
function phaseElapsed(name){
  const c=phaseClocks[name];
  return c.start===null?0:Math.max(0,Math.min(c.limit,(c.end??Date.now())-c.start));
}
function finishInitialPhase(timedOut=false,at=Date.now()){
  stopPhase("initial",at,timedOut);
  commitPageTime(at);
  closeVisit(at);
  freezeInitialAnswers();
  currentPage=PAGES.findIndex(p=>p.id==="feedback");
  pageEnteredAt=Date.now();
  showHint=false;
  closeModal();
}
function checkPhaseDeadlines(){
  if(state.submitted || state.sending || pendingPayload) return false;
  const now=Date.now();
  const initial=phaseClocks.initial;
  if(initial.start!==null && initial.end===null && now>=initial.start+initial.limit){
    finishInitialPhase(true,initial.start+initial.limit);render();return true;
  }
  const review=phaseClocks.review;
  if(review.start!==null && review.end===null && now>=review.start+review.limit){
    const cutoff=review.start+review.limit;
    stopPhase("review",cutoff,true);
    // 확인을 누르지 않은 검토 초안은 확정 제출 횟수와 최종점수에 넣지 않습니다.
    continueAfterRetry(cutoff);return true;
  }
  const wait=phaseClocks.wait;
  if(wait.start!==null && wait.end===null && now>=wait.start+wait.limit){
    const cutoff=wait.start+wait.limit;
    stopPhase("wait",cutoff);
    waitCompleted=true;waitMode=false;
    continueAfterRetry(cutoff);return true;
  }
  return false;
}
function startWaiting(){
  if(waitCompleted) {continueAfterRetry();return;}
  waitRequired=true;waitMode=true;
  startPhase("wait");
  render();
}
function renderWaiting(){
  if(!enterVisit({id:"retry-wait",type:"wait"})) return;
  stageEl.dataset.screen="wait";
  renderChrome(currentPage+1,PAGES.length,"잠시 기다려 주세요");

}

},true));

function makeUuid(){
  if(globalThis.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  if(!globalThis.crypto || !crypto.getRandomValues) throw new Error("보안 난수 기능이 필요합니다.");
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  const hex = [...bytes].map(b=>b.toString(16).padStart(2,"0")).join("");
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}
function freezeInitialAnswers(){
  if(state.initialAnswers) return;
  state.initialAnswers = {};
  PROBLEMS.forEach(p=>{
    const saved = state.math[p.id] || {};
    state.initialAnswers[p.id] = p.kind === "mc"
      ? {selected:saved.selected ?? null}
      : {value:String(saved.value ?? "")};
  });
}

function updateVisibleTime(now){
  if(!activeVisit) return;
  if(activeVisit.visibleSince != null) activeVisit.visible_ms += Math.max(0,now-activeVisit.visibleSince);
  activeVisit.visibleSince = document.visibilityState === "hidden" ? null : now;
}
function closeVisit(now=Date.now()){
  if(!activeVisit) return;
  const phaseName=activeVisit.phase==="initial"?"initial":activeVisit.phase==="review"?"review":activeVisit.screen_id==="retry-wait"?"wait":null;
  const clock=phaseName?phaseClocks[phaseName]:null;
  if(clock && clock.start!==null) now=Math.min(now,clock.end??(clock.start+clock.limit));
  // 지연된 렌더와 마감이 같은 순간 겹쳐도 역전된 시각을 저장하지 않습니다.
  now=Math.max(activeVisit.enteredMs,now);
  updateVisibleTime(now);
  const duration = Math.max(0,now-activeVisit.enteredMs);
  screenVisits.push({
    visit_no:screenVisits.length+1, screen_id:activeVisit.screen_id,
    screen_type:activeVisit.screen_type, problem_id:activeVisit.problem_id,
    phase:activeVisit.phase, entered_at:new Date(activeVisit.enteredMs).toISOString(),
    exited_at:new Date(now).toISOString(), duration_ms:duration,
    visible_ms:Math.min(duration,activeVisit.visible_ms)
  });
  activeVisit = null;
}
function enterVisit(page,isReview=false){
  const now=Date.now();
  if(checkPhaseDeadlines()) return false;
  const identity = isReview ? "retry-"+page.data.id : page.id;
  if(activeVisit && activeVisit.screen_id===identity) return true;
  closeVisit(now);
  const phase=isReview ? "review" : page.type==="problem" ? "initial"
    : ["reason","post1","post2","post3","attribution"].includes(page.id) ? "survey"
    : page.dwell || page.id==="check" ? "lesson" : "other";
  activeVisit={screen_id:identity,screen_type:isReview?"retry":page.type,
    problem_id:page.data ? page.data.id : null,phase,enteredMs:now,
    visible_ms:0,visibleSince:document.visibilityState==="hidden"?null:now};
  return true;
}
document.addEventListener("visibilitychange",()=>{

function chunkItems(items, size){
  const pages = [];
  for(let i=0;i<items.length;i+=size) pages.push(items.slice(i, i+size));
  return pages;
}

function surveyPages(){
  const pages = [{
    type:"scale", id:"reason", label:"이유", optional:true, showReason:true,
    intro:"수학 목표 달성 결과를 보고, 이러한 결과가 나온 이유를 작성해보았습니다. 내가 생각한 이유는 이전 페이지에서 작성했거나 마음속으로 떠올린 가장 중요한 이유를 말합니다.",
    corner:"내가 수학 목표 달성에 실패 또는 성공한 이유는",
    items:REASON_ITEMS
  }];
  chunkItems([...ADAPT_ITEMS, ...BEHAVE_ITEMS], 4).forEach((items, i)=>{
    pages.push({
      type:"scale", id:"post"+(i+1), label:"설문", optional:false,
      prompt:"<이번 활동에서 문제를 틀렸을 때>",
      intro:ADAPT_INTRO,
      corner:"이번 수학 활동에서 문제를 풀다가 틀렸지만,",
      items
    });
  });
  return pages;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.innerText = str == null ? "" : String(str);
  return d.innerHTML;
}
function normAnswer(s){
  return String(s||"").trim().toLowerCase().replace(/[\s,]/g,"").replace(/개|cm³|cm3|㎤|세제곱센티미터/g,"");
}
function grade(problem, saved){
  if(!saved) return null;
  if(problem.kind==="mc"){
    if(problem.answerIndex==null || saved.selected==null) return null;
    return saved.selected === problem.answerIndex;
  }
  if(problem.answer==null) return null;
  if(!String(saved.value||"").trim()) return null;
  return normAnswer(saved.value) === normAnswer(problem.answer);
}
function sentenceStem(){
  const page = PAGES.find(p=>p.type==="sentence");
  return page ? page.stem : "";
}
function formatClock(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}
function dwellLeft(page){
  if(!page?.dwell || page.type==="sentence") return 0;
  const saved = state.dwellMs[page.id] || 0;
  const live = Date.now() - pageEnteredAt;
  const limit = ["read","expert","stories"].includes(page.type) ? CONFIG.READING_DWELL_MS : CONFIG.DWELL_MS;
  return Math.max(0, limit - saved - live);
}

function renderChrome(current, total, title){

function closeModal(){ modalRoot.innerHTML = ""; }

function render(){
  if(checkPhaseDeadlines()) return;
  clearInterval(dwellTimer);
  closeModal();
  stageEl.classList.remove("is-end");
  if(!state.group){ closeVisit(); renderCode(); return; }
  if(waitMode){ renderWaiting(); return; }
  if(retryMode){ renderRetry(); return; }
  if(state.submitted){ closeVisit(); renderSubmitScreen(); return; }
  if(state.sending || pendingPayload){ closeVisit(); renderSaveProgress(); return; }
  if(state.thanks){ renderThanks(); return; }
  const page = PAGES[currentPage];
  if(page.type==="problem" && !state.initialAnswers) startPhase("initial");
  if(page.id==="feedback"){
    const endedAt=Date.now();
    stopPhase("initial",endedAt);
    closeVisit(phaseClocks.initial.end??endedAt);
    freezeInitialAnswers();
  }
  if(!enterVisit(page)) return;
  stageEl.dataset.screen = page.type;
  renderChrome(currentPage+1, PAGES.length, page.label);
  let html = memoHtml(page);
  if(page.showReason && state.attribution.trim()){
    html += `<aside class="memo is-wrap"><span class="tag">내가 쓴 이유</span><p>${escapeHtml(state.attribution.trim())}</p></aside>`;
  }
  switch(page.type){
    case "info": html += renderInfo(); break;
    case "guide": html += renderGuide(page); break;
    case "read": html += renderRead(page); break;
    case "expert": html += renderExpert(page); break;
    case "stories": html += renderStories(page); break;
    case "summary": html += renderSummary(page); break;
    case "sentence": html += renderSentence(page); break;
    case "scale": html += renderScale(page); break;
    case "goal": html += renderGoal(); break;
    case "feedback": html += renderFeedback(); break;
    case "attribution": html += renderAttribution(); break;
    case "problem": html += renderProblem(page.data, state.math[page.data.id], false); break;
    case "finish": html += renderFinish(); break;
    case "closing": html += renderClosing(); break;
  }
  appEl.innerHTML = html;
  attachPageEvents(page);
  renderNav(page);
}

function dwellSeconds(){
  return Math.round(CONFIG.DWELL_MS / 1000);
}
function dwellLabel(){
  const sec = dwellSeconds();
  if(sec > 0 && sec % 60 === 0) return `${sec / 60}분`;
  return `${sec}초`;
}
function loadDwell(){
  try{
    const raw = localStorage.getItem(DWELL_STORE_KEY);
    if(raw == null || raw === "") return;
    applyDwell(Number(raw), false);
  }catch(e){}
}
function applyDwell(sec, persist){
  if(!Number.isInteger(sec) || sec < 1 || sec > CONFIG.DWELL_MAX_SEC) return false;
  CONFIG.DWELL_MS = sec * 1000;
  if(persist){
    try{ localStorage.setItem(DWELL_STORE_KEY, String(sec)); }catch(e){}
  }
  return true;
}

function renderCode(){
  const codesReady = CONFIG.CODES!==null;
  if(!state.expose){

  }
  stageEl.dataset.screen = "group";
  renderChrome(1, 1, "시작");
  appEl.innerHTML = screen("screen-stack", `

        <button type="button" class="primary" id="btnCode">시작하기</button>
      </div>
    </section>`);
  navEl.innerHTML = "";
  const input = document.getElementById("f_code");
  input.maxLength = 100;
  input.disabled = !codesReady;
  const go = ()=>submitCode(input.value);
  const button = document.getElementById("btnCode");
  button.disabled = !codesReady;
  button.onclick = go;
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") go(); });
  if(codesReady) input.focus();
}

function submitCode(raw){
  if(!CONFIG.CODES){
    const hint = document.getElementById("codeHint");
    if(hint){ hint.textContent = CODE_CONFIG_ERROR; hint.classList.add("is-error"); }
    return;
  }
  const code = String(raw || "").trim();
  if(code === CONFIG.CODES.exp){ enterWithCode(code, "exp"); return; }
  if(code === CONFIG.CODES.ctrl){ enterWithCode(code, "ctrl"); return; }
  const hint = document.getElementById("codeHint");
  if(hint){
    hint.textContent = "코드를 다시 확인해 주세요.";
    hint.classList.add("is-error");
  }
}
function enterWithCode(code, group){
  state.entryCode = code;
  chooseGroup(group);
}

function chooseGroup(group){
  if(!CONFIG.CODES || !["exp","ctrl"].includes(group)) return;
  state.group = group;
  if(!state.startedAt){ state.startedAt = Date.now(); submissionId=makeUuid(); receiptToken=makeUuid()+makeUuid(); }
  currentPage = 0;
  pageEnteredAt = Date.now();
  showHint = false;
  PAGES = buildPages(group);
  render();
}

    return `<tr><td>${escapeHtml(item.text)}</td>${cells}</tr>`;
  }).join("");
  return screen("screen-scale", `
    <div class="survey-copy">
      ${page.heading ? `<h2>${escapeHtml(page.heading)}</h2>` : ""}

        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${page.note ? `<p class="survey-note">${escapeHtml(page.note)}</p>` : ""}`);
}

function mathOptionHtml(value){
  const match = String(value).match(/^(?:(\d+) )?(\d+)\/(\d+)(kg)?$/);
  if(!match) return escapeHtml(value);
  const [,whole,numerator,denominator,unit] = match;
  return `<span class="math-number" aria-label="${escapeHtml(value)}">${whole ? `<span>${whole}</span>` : ""}<span class="math-fraction"><span class="math-numerator">${numerator}</span><span class="math-denominator">${denominator}</span></span>${unit ? `<span>${unit}</span>` : ""}</span>`;
}

function problemDiagramHtml(item){
  if(item.diagram==="prism-elements") return `<div class="problem-stimulus problem-equations">
    <p>(면의 수) = (한 밑면의 변의 수) + <span class="problem-blank" aria-label="빈칸"></span></p>
    <p>(꼭짓점의 수) = (한 밑면의 변의 수) × <span class="problem-blank" aria-label="빈칸"></span></p>
  </div>`;
  if(item.diagram==="bank-interest") return `<div class="problem-stimulus"><table class="problem-table" aria-label="세 은행에 예금한 돈과 1년 동안 받은 이자">
    <thead><tr><th scope="col">은행</th><th scope="col">예금한 돈(원)</th><th scope="col">받은 이자(원)</th></tr></thead>
    <tbody><tr><th scope="row">㉠</th><td>100000</td><td>2300</td></tr><tr><th scope="row">㉡</th><td>80000</td><td>1600</td></tr><tr><th scope="row">㉢</th><td>150000</td><td>3750</td></tr></tbody>
  </table></div>`;
  if(item.diagram==="sugar-salt") return `<div class="problem-stimulus problem-quantities"><span>설탕: ${mathOptionHtml("4 1/2kg")}</span><span>소금: ${mathOptionHtml("3 1/3kg")}</span></div>`;
  if(item.diagram==="fraction-number-line"){
    const ticks=Array.from({length:11},(_,i)=>`<line x1="${64+i*60}" y1="${i===0||i===10?35:43}" x2="${64+i*60}" y2="${i===0||i===10?95:87}"/>`).join("");
    return `<div class="problem-stimulus"><svg class="number-line" viewBox="0 0 728 190" role="img" aria-label="3과 10분의 1부터 3과 10분의 2까지 10등분한 수직선. 왼쪽 끝점에서 오른쪽으로 여섯 번째 눈금에 ㉠이 표시되어 있습니다.">
      <g fill="none" stroke="currentColor" stroke-width="2"><line x1="40" y1="65" x2="688" y2="65"/>${ticks}</g>
      <g fill="currentColor" font-family="sans-serif" font-size="28" text-anchor="middle"><text x="424" y="123">㉠</text>
        <text x="42" y="150">3</text><text x="78" y="132">1</text><text x="78" y="172">10</text>
        <text x="642" y="150">3</text><text x="678" y="132">2</text><text x="678" y="172">10</text>
      </g><g stroke="currentColor" stroke-width="1.5"><line x1="59" y1="141" x2="97" y2="141"/><line x1="659" y1="141" x2="697" y2="141"/></g>
    </svg></div>`;
  }
  return figureHtml(item.image);
}

function renderProblem(item, saved, fresh){
  const letters = ["1","2","3","4","5"];

      <label class="kicker" for="f_answer">정답을 입력하세요</label>

function renderRetry(){
  const item = retryList[retryIndex];
  state.reviewEntered = true;
  startPhase("review");
  if(!enterVisit({id:"retry-"+item.id,type:"retry",data:item},true)) return;
  if(retryStampIndex !== retryIndex){
    retryStampIndex = retryIndex;
    retryEnteredAt = Date.now();
    retryLastCheckAt = retryEnteredAt;
  }
  stageEl.dataset.screen = "retry";
  renderChrome(retryIndex+1, retryList.length, "다시 풀기");
  const draft = item.kind==="mc"
    ? { selected: state._retryPick ? state._retryPick[item.id] : null }
    : { value: retryDraft[item.id] || "" };
  appEl.innerHTML = memoHtml({ memo:true }) + renderProblem(item, draft, false);
  navEl.innerHTML = `
    <div class="navbar-inner">
      <button type="button" class="ghost" id="navPrev" ${retryIndex===0?"disabled":""}>이전</button>
      <div class="spacer"></div>
      <p class="nav-hint" id="navHint"></p>
      <button type="button" class="primary" id="navCheck">확인</button>
    </div>`;
  document.querySelectorAll(".opt").forEach(opt=>{
    opt.onclick = ()=>{
      if(checkPhaseDeadlines() || !retryMode) return;
      retryDraft[item.id] = null;
      state._retryPick = state._retryPick || {};
      state._retryPick[item.id] = parseInt(opt.dataset.idx, 10);
      document.querySelectorAll(".opt").forEach(el=>el.classList.toggle("selected", el===opt));
    };
  });
  const input = document.getElementById("f_answer");
  if(input){
    input.maxLength = 2000;
    input.oninput = ()=>{ if(checkPhaseDeadlines() || !retryMode) return; retryDraft[item.id] = input.value; };
  }
  document.getElementById("navPrev").onclick = ()=>{
    if(checkPhaseDeadlines() || !retryMode || retryIndex===0) return;
    retryIndex--;
    render();
  };
  document.getElementById("navCheck").onclick = ()=>checkRetry(item);
}

function currentRetryAnswer(item){
  if(item.kind==="mc") return state._retryPick ? state._retryPick[item.id] : null;
  return retryDraft[item.id] || "";
}

function checkRetry(item){
  if(checkPhaseDeadlines() || !retryMode) return;
  const picked = item.kind==="mc" ? (state._retryPick && state._retryPick[item.id]) : null;
  const value = item.kind==="short" ? (retryDraft[item.id]||"") : "";
  const has = item.kind==="mc" ? picked!=null && !Number.isNaN(picked) : String(value).trim().length>0;
  const hint = document.getElementById("navHint");
  if(!has){
    if(hint) hint.textContent = "답을 입력한 뒤 확인해 주세요.";
    return;
  }
  const saved = item.kind==="mc" ? { selected:picked } : { value };
  const ok = grade(item, saved);
  const log = state.retryLog[item.id] || { back:0, skip:0, correct:false, responses:[] };
  const now = Date.now();
  const event = {event_id:makeUuid(),problem_id:item.id,attempt_no:log.responses.length+1,
    ...saved,at:new Date(now).toISOString(),elapsed_ms:Math.max(0,now-retryEnteredAt),
    duration_ms:Math.max(0,now-retryLastCheckAt)};
  retryLastCheckAt = now;
  allAttempts.push(event);
  log.responses.push({ ...saved, isCorrect: ok, at:event.at, ms:event.elapsed_ms });
  state.retryLog[item.id] = log;
  if(ok===true){
    log.correct = true;
    openModal(true, item.id);
  } else if(ok===false){
    openModal(false, item.id);
  } else {
    advanceRetry();
  }
}

function openModal(correct, problemId){
  modalRoot.innerHTML = correct ? `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true">
        <p class="msg">정답입니다.</p>
        <div class="modal-actions end">
          <button type="button" class="primary" id="btnModalNext">다음</button>
        </div>
      </div>
    </div>` : `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true">
        <p class="msg">정답이 아닙니다.</p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnModalBack">문제로 돌아가기</button>
          <button type="button" class="primary" id="btnModalSkip">건너뛰기</button>
        </div>
      </div>
    </div>`;
  if(correct){
    document.getElementById("btnModalNext").onclick = ()=>advanceRetry();
  } else {
    document.getElementById("btnModalBack").onclick = ()=>{
      if(checkPhaseDeadlines() || !retryMode) return;
      state.retryLog[problemId].back = 1;
      closeModal();
    };
    document.getElementById("btnModalSkip").onclick = ()=>{
      if(checkPhaseDeadlines() || !retryMode) return;
      state.retryLog[problemId].skip = 1;
      advanceRetry();
    };
  }
}

function continueAfterRetry(at=Date.now()){
  if(waitMode && !waitCompleted) return;
  stopPhase("review",at);
  closeVisit(at);
  closeModal();
  retryMode = false;
  const idx = PAGES.findIndex(p=>p.id==="feedback");
  if(idx < 0 || idx >= PAGES.length-1){
    finishActivity();
    return;
  }
  currentPage = idx + 1;
  pageEnteredAt = Date.now();
  render();
}
function advanceRetry(){
  if(checkPhaseDeadlines() || !retryMode) return;
  closeModal();
  if(retryIndex < retryList.length-1){
    retryIndex++;
    render();
  } else {
    continueAfterRetry();
  }
}

function openRetryChoice(){
  modalRoot.innerHTML = `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true">
        <p class="msg">문제를 다시 풀어 볼까요?</p>
        <p class="modal-lead">틀린 문제를 다시 풀 수 있습니다. 풀지 않으면 잠시 기다린 뒤 다음 질문으로 이동합니다.</p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnNoRetry">안 풀겠습니다</button>
          <button type="button" class="primary" id="btnYesRetry">다시 풀겠습니다</button>
        </div>
      </div>
    </div>`;
  document.getElementById("btnYesRetry").onclick = ()=>{
    state.retryAsked = true;
    state.retryChoice = "yes";
    closeModal();
    if(!retryMode) commitPageTime();
    startRetry();
  };
  document.getElementById("btnNoRetry").onclick = ()=>{
    state.retryAsked = true;
    state.retryChoice = "no";
    if(!retryMode) commitPageTime();
    startWaiting();
  };
}

function startRetry(){
  if(phaseClocks.review.end!==null) return;
  state.didRetry = true;
  retryList = PROBLEMS.filter(p=>grade(p, initialMath()[p.id])!==true);
  if(!retryList.length){
    modalRoot.innerHTML = `
      <div class="modal-back"><div class="modal" role="dialog" aria-modal="true">
        <p class="msg">다시 풀 틀린 문제가 없습니다.</p>
        <div class="modal-actions end"><button type="button" class="primary" id="btnNoWrong">알겠습니다</button></div>
      </div></div>`;
    document.getElementById("btnNoWrong").onclick = ()=>continueAfterRetry();
    return;
  }
  retryMode = true;
  retryIndex = 0;
  retryDraft = {};
  state._retryPick = {};
  retryStampIndex = -1;
  render();
}

function attachPageEvents(page){
  if(page.type==="info"){
    ["number","school","grade","classroom","name"].forEach(key=>{
      const el = document.getElementById("f_"+key);
      el.maxLength = 200;
      el.oninput = ()=>{ state.studentInfo[key] = el.value; updateNavValidity(); };
    });
    document.querySelectorAll(".gender-btn").forEach(btn=>{
      btn.onclick = ()=>{
        state.studentInfo.gender = btn.dataset.g;
        document.querySelectorAll(".gender-btn").forEach(b=>b.classList.toggle("selected", b===btn));
        updateNavValidity();
      };
    });
  }
  if(page.type==="summary"){
    const el = document.getElementById("f_summary");
    el.maxLength = 30000;
    el.oninput = ()=>{ state.summary = el.value; updateNavValidity(); };
  }
  if(page.type==="sentence"){
    const el = document.getElementById("f_sentence");
    el.maxLength = 30000;
    el.oninput = ()=>{ state.sentence = el.value; updateNavValidity(); };
  }
  if(page.type==="attribution"){
    const el = document.getElementById("f_attribution");
    el.maxLength = 30000;
    el.oninput = ()=>{ state.attribution = el.value; updateNavValidity(); };
  }
  if(page.type==="scale" || page.id==="guide-scale"){
    document.querySelectorAll(".cell-pick").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.scale;
        state.scales[id] = parseInt(btn.dataset.v, 10);
        btn.closest("tr").querySelectorAll(".cell-pick").forEach(el=>el.classList.toggle("selected", el===btn));
        updateNavValidity();
      };
    });
  }
  if(page.type==="problem"){
    const item = page.data;
    document.querySelectorAll(".opt").forEach(opt=>{
      opt.onclick = ()=>{
        if(checkPhaseDeadlines() || state.initialAnswers) return;
        const idx = parseInt(opt.dataset.idx, 10);
        const prev = state.math[item.id] || {};
        state.math[item.id] = { ...prev, selected: idx, isCorrect: item.answerIndex==null ? null : idx===item.answerIndex };
        document.querySelectorAll(".opt").forEach(el=>el.classList.toggle("selected", el===opt));
        updateNavValidity();
      };
    });
    const input = document.getElementById("f_answer");
    if(input){
      input.maxLength = 2000;
      input.oninput = ()=>{
        if(checkPhaseDeadlines() || state.initialAnswers) return;
        const prev = state.math[item.id] || {};
        const value = input.value;
        state.math[item.id] = { ...prev, value, isCorrect: grade(item, { value }) };
        updateNavValidity();
      };
    }
  }
}

function isCurrentPageValid(){
  const page = PAGES[currentPage];
  if(!page) return true;
  switch(page.type){
    case "info": {
      const s = state.studentInfo;
      return s.number.trim() && s.school.trim() && s.grade.trim() && s.classroom.trim() && s.name.trim() && s.gender;
    }
    case "summary": return state.summary.trim().length>0;
    case "sentence": return state.sentence.trim().length>0;
    case "attribution": return state.attribution.trim().length>0;
    case "scale":
      if(page.optional) return true;
      return page.items.every(item=>Number.isFinite(state.scales[item.id]));
    case "problem": {
      const saved = state.math[page.data.id];
      if(!saved) return false;
      if(page.data.kind==="mc") return saved.selected!=null;
      return String(saved.value||"").trim().length>0;
    }
    default: return true;
  }
}

function updateNavValidity(){
  const nextBtn = document.getElementById("navNext");
  const hint = document.getElementById("navHint");
  if(!nextBtn) return;
  const ok = isCurrentPageValid();
  nextBtn.hidden = PAGES[currentPage]?.type==="sentence" && !ok;
  nextBtn.classList.toggle("is-waiting", !ok);
  nextBtn.setAttribute("aria-disabled", ok ? "false" : "true");
  if(hint) hint.textContent = (showHint && !ok) ? "계속하려면 모든 항목에 응답해 주세요." : "";
}

function renderNav(page){
  clearInterval(dwellTimer);
  // 첫 결과를 본 뒤 최초 풀이로 되돌아가 답을 바꾸지 않도록 경계를 잠급니다.
  const hidePrev = (currentPage===0 && state.groupLocked) || page.id==="feedback"
    || page.id==="q1" || (page.id==="attribution" && state.retryAsked);
  const locked = page.dwell && dwellLeft(page)>0;
  const isLast = currentPage === PAGES.length - 1;
  navEl.innerHTML = `
    <div class="navbar-inner">
      ${hidePrev ? "" : `<button type="button" class="ghost" id="navPrev">이전</button>`}
      <div class="spacer"></div>
      <p class="nav-hint" id="navHint"></p>
      ${locked ? `<span class="timer-pill" id="dwellClock">${formatClock(dwellLeft(page))}</span>` : `<button type="button" class="primary" id="navNext">${isLast ? "제출" : "다음"}</button>`}
    </div>`;
  if(!hidePrev){
    document.getElementById("navPrev").onclick = ()=>{
      if(currentPage===0){
        commitPageTime();
        state.group = null;
        render();
        return;
      }
      commitPageTime();
      showHint = false;
      currentPage--;
      render();
    };
  }
  if(!locked){
    document.getElementById("navNext").onclick = ()=>{
      if(checkPhaseDeadlines()) return;
      if(!isCurrentPageValid()){
        showHint = true;
        updateNavValidity();
        return;
      }
      showHint = false;
      if(page.id==="feedback" && !state.retryAsked){
        openRetryChoice();
        return;
      }
      commitPageTime();
      if(isLast) finishActivity();
      else { currentPage++; render(); }
    };
    updateNavValidity();
  }
  if(locked){
    dwellTimer = setInterval(()=>{
      const left = dwellLeft(PAGES[currentPage]);
      const clock = document.getElementById("dwellClock");
      if(!clock){ clearInterval(dwellTimer); return; }
      if(left<=0){
        clearInterval(dwellTimer);
        renderNav(PAGES[currentPage]);
      } else {
        clock.textContent = formatClock(left);
      }
    }, 250);
  }
}

function commitPageTime(now=Date.now()){
  const page = PAGES[currentPage];
  if(!page) return;
  const elapsed = Math.max(0,now-pageEnteredAt);
  state.pageMs[page.id] = (state.pageMs[page.id]||0) + elapsed;
  if(page.dwell) state.dwellMs[page.id] = (state.dwellMs[page.id]||0) + elapsed;
  if(page.type==="problem"){
    const prev = state.math[page.data.id] || {};
    state.math[page.data.id] = { ...prev, responseTimeMs:(prev.responseTimeMs||0)+elapsed };
  }
  pageEnteredAt = Date.now();
}

/* 한 셀에 한 값으로 펼치는 작업은 Code.gs에서 검증·채점 후 수행합니다.
   전송 중첩 객체는 통신 형식이며 Google Sheets 셀에 JSON으로 저장하지 않습니다. */
function buildPayload(){
  freezeInitialAnswers();
  const info=state.studentInfo;
  const scales={};
  [...CHECK_ITEMS,...REASON_ITEMS,...ADAPT_ITEMS,...BEHAVE_ITEMS].forEach(it=>{
    scales[it.id]=Number.isFinite(state.scales[it.id]) ? state.scales[it.id] : null;
  });
  return {
    schema_version:"1.2.0", submission_id:submissionId, receipt_token:receiptToken,
    client_started_at:new Date(state.startedAt).toISOString(),
    client_submitted_at:new Date().toISOString(),group:state.group,expose:state.expose,
    entry_code:state.entryCode,
    student:{school:info.school,grade:info.grade,classroom:info.classroom,
      number:info.number,name:info.name,gender:info.gender},
    summary:state.summary,sentence:state.sentence,attribution:state.attribution,
    example:state.scales.example ?? null,scales,
    initial_answers:JSON.parse(JSON.stringify(state.initialAnswers)),
    retry_choice:state.retryChoice,review_entered:state.reviewEntered,
    attempts:JSON.parse(JSON.stringify(allAttempts)),
    screen_visits:JSON.parse(JSON.stringify(screenVisits)),
    duration_total_ms:Math.max(0,Date.now()-state.startedAt),
    timing:{math_limit_ms:CONFIG.MATH_LIMIT_MS,review_limit_ms:CONFIG.REVIEW_LIMIT_MS,
      wait_limit_ms:CONFIG.WAIT_LIMIT_MS,initial_elapsed_ms:phaseElapsed("initial"),
      review_elapsed_ms:phaseElapsed("review"),wait_elapsed_ms:phaseElapsed("wait"),
      initial_timed_out:phaseClocks.initial.timedOut,review_timed_out:phaseClocks.review.timedOut,
      wait_required:waitRequired,wait_completed:waitCompleted},
    settings:{dwell_ms:CONFIG.DWELL_MS,pass_threshold:CONFIG.PASS_THRESHOLD}
  };
}

function renderSaveProgress(){
  stageEl.classList.add("is-end");
  renderChrome(PAGES.length,PAGES.length,state.sending?"저장 중":"저장 확인");
  appEl.innerHTML=screen("screen-message",`<p class="goal-banner">${state.sending
    ? "응답을 저장하고 있습니다.<br>잠시 기다려 주세요."
    : "응답 저장을 확인하지 못했습니다.<br>이 화면을 닫지 말고 다시 시도해 주세요."}</p>`);
  navEl.innerHTML=state.sending ? "" : `<div class="navbar-inner"><div class="spacer"></div><button type="button" class="primary" id="retrySave">다시 저장하기</button></div>`;
  if(!state.sending) document.getElementById("retrySave").onclick=()=>sendPendingPayload();
}
function pauseFor(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function isValidEndpoint(url){
  try{const u=new URL(url);return u.protocol==="https:" && u.hostname==="script.google.com"
    && /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname) && !u.search && !u.hash;}
  catch(e){return false;}
}
function requestReceipt(endpoint,payload,timeoutMs=4500){
  return new Promise((resolve,reject)=>{
    const callback="researchReceipt_"+makeUuid().replace(/-/g,"");
    const script=document.createElement("script");
    let timer;
    const cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove();};
    window[callback]=(result)=>{cleanup();resolve(result);};
    script.onerror=()=>{cleanup();reject(new Error("RECEIPT_UNAVAILABLE"));};
    const params=new URLSearchParams({action:"status",submission_id:payload.submission_id,
      token:payload.receipt_token,callback});
    script.src=endpoint+"?"+params.toString();
    timer=setTimeout(()=>{cleanup();reject(new Error("RECEIPT_TIMEOUT"));},timeoutMs);
    document.head.appendChild(script);
  });
}
function isCompleteReceipt(receipt,payload){
  return receipt && receipt.ok===true && receipt.status==="complete"
    && receipt.submission_id===payload.submission_id;
}
async function saveToSheets(payload){
  if(globalThis.google && google.script && google.script.run){
    return await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error("SAVE_TIMEOUT")),45000);
      google.script.run.withSuccessHandler(result=>{clearTimeout(timer);resolve(result);})
        .withFailureHandler(error=>{clearTimeout(timer);reject(error);}).saveSubmission(payload);
    });
  }
  const endpoint=String(CONFIG.GAS_ENDPOINT || "").trim();
  if(!isValidEndpoint(endpoint)) throw new Error("연구자가 새 수집 웹 앱 주소를 설정해야 합니다.");
  // no-cors의 opaque 응답은 저장 성공이 아닙니다. 아래 독립 영수증을 확인합니다.
  const controller=new AbortController();
  const postTimer=setTimeout(()=>controller.abort(),12000);
  try{
    await fetch(endpoint,{method:"POST",mode:"no-cors",redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload),signal:controller.signal});
  }catch(error){
    // POST 응답이 끊겨도 서버가 저장했을 수 있으므로 동일 ID 영수증부터 확인합니다.
  }finally{clearTimeout(postTimer);}
  const deadline=Date.now()+30000;
  for(let attempt=0;Date.now()<deadline;attempt++){
    await pauseFor(Math.min(1000+attempt*500,3000));
    let receipt;
    try{receipt=await requestReceipt(endpoint,payload,Math.min(4500,Math.max(1,deadline-Date.now())));}
    catch(error){continue;}
    if(isCompleteReceipt(receipt,payload)) return receipt;
    if(receipt && receipt.status==="error") throw new Error("SERVER_SAVE_ERROR");
  }
  throw new Error("SAVE_NOT_CONFIRMED");
}
async function sendPendingPayload(){
  if(state.sending || state.submitted || !pendingPayload) return;
  state.sending=true;state.submitError="";render();
  try{
    const receipt=await saveToSheets(pendingPayload);
    if(!isCompleteReceipt(receipt,pendingPayload)) throw new Error("INVALID_RECEIPT");
    state.submitted=true;state.sending=false;render();
  }catch(error){
    state.sending=false;state.submitError="SAVE_NOT_CONFIRMED";
    console.error("응답 저장 미확인:",error && error.message ? error.message : "SAVE_FAILED");
    render();
  }
}
function finishActivity(){
  if(state.submitted || state.sending) return;
  if(!pendingPayload){
    if(!retryMode) commitPageTime();
    closeVisit();retryMode=false;closeModal();
    // 재전송은 같은 ID와 같은 내용을 유지하며 중복 행을 만들지 않습니다.
    pendingPayload=buildPayload();
  }
  return sendPendingPayload();
}

window.addEventListener("beforeunload", (e)=>{
  if(state.group && !state.submitted){
    e.preventDefault();
    e.returnValue = "";
  }
});

loadDwell();
render();

</script>
