<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 학습 활동</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
  /* =====================================================================
     컨셉: 정돈된 학습지
     - 한 화면은 헤더 + 본문 + 하단 이동으로 이루어지고, 본문이 카드 높이를 채운다.
     - 시작·학습·마무리는 깊은 녹색 칠판, 문제·응답·안내는 따뜻한 종이.
     - 새 화면은 PAGES에 타입을 추가하고 screen()으로 아래 레이아웃 중 하나를 쓴다.
       screen-split   칠판 + 작업 영역 (정보 입력, 글 읽기, 글쓰기, 선택)
       screen-quiz    문제 + 늘어나는 선택지
       screen-scale   문장 + 5점 척도
       screen-message 안내·결과처럼 한 문장이 화면을 차지하는 화면
       screen-media   영상. .media-frame 이 남는 높이를 채운다
       screen-end     종료 칠판
     - 색을 바꿀 때는 :root 토큰만 고친다.
     ===================================================================== */
  :root{
    color-scheme: light;
    --bg-a:#e7dfd0;
    --bg-b:#e3ebe3;
    --sheet:#f6f1e7;
    --white:#fffcf8;
    --ink:#1a2332;
    --muted:#5e6878;
    --navy:#1b3352;
    --navy-soft:#e7eef6;
    --line:rgba(27,51,82,.12);
    --line-strong:rgba(27,51,82,.22);
    --board:#1a4334;
    --board-2:#123228;
    --cream:#f3ecdf;
    --coral:#b55245;
    --coral-soft:#f8ece8;
    --moss:#2c6b4e;
    --moss-soft:#e7f3ec;
    --shadow:0 28px 70px rgba(48,40,28,.14), 0 2px 8px rgba(48,40,28,.05);
    --radius:28px;
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --serif:"Nanum Myeongjo","Batang","Apple Myungjo",serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(900px 480px at 0% 0%, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(700px 520px at 100% 100%, rgba(26,67,52,.13), transparent 50%),
      linear-gradient(165deg, var(--bg-a), var(--bg-b) 58%, #e6ddcf);
  }
  button,input,textarea{font-family:inherit; color:inherit;}
  button{margin:0;}
  p,h1,h2{margin:0;}
  ::selection{background:#d7e4f3;}

  .app-bg{
    height:100dvh;
    display:grid;
    place-items:center;
    padding:20px 24px;
  }
  .stage{
    width:min(1080px,100%);
    height:min(860px,100%);
    background:var(--sheet);
    border:1px solid rgba(27,51,82,.16);
    border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.75);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .stage-head{flex:0 0 auto; background:rgba(255,252,248,.72);}
  .stage-head-row{
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 26px 12px;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand strong{font-size:16px; letter-spacing:-.02em; white-space:nowrap;}
  .section-name{
    color:var(--muted);
    font-size:13px;
    font-weight:500;
    padding-left:12px;
    margin-left:2px;
    border-left:1px solid var(--line-strong);
    white-space:nowrap;
  }
  .step{
    display:flex;
    align-items:baseline;
    gap:4px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    font-size:13px;
    flex:none;
  }
  .step b{color:var(--ink); font-size:15px; font-weight:700;}
  .track{height:3px; background:rgba(27,51,82,.08);}
  .track span{display:block; height:100%; background:var(--navy);}

  .stage-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:20px 24px 18px;
    overflow:hidden;
  }
  .screen{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
  }

  .stage-foot{
    flex:none;
    border-top:1px solid var(--line);
    background:rgba(255,252,248,.92);
    padding:14px 22px 16px;
  }
  .stage-foot:empty{display:none;}
  .navbar-inner{display:flex; align-items:center; gap:12px;}
  .spacer{flex:1;}
  .nav-hint{font-size:13px; color:var(--coral); font-weight:600;}
  .nav-hint:empty{display:none;}

  button{
    font-size:15px;
    font-weight:650;
    letter-spacing:-.01em;
    padding:12px 22px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:var(--white);
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .12s;
  }
  button:hover:not(:disabled){border-color:rgba(27,51,82,.45);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:focus-visible,.opt:focus-visible,.scale-btn:focus-within{
    outline:3px solid rgba(27,51,82,.28);
    outline-offset:2px;
  }
  button.primary{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    min-width:112px;
  }
  button.primary:hover:not(:disabled){background:#243f64;}
  button.primary.is-waiting{background:#d5dde8; border-color:#d5dde8; color:#fff;}
  button.primary:disabled{background:#c5d0de; border-color:#c5d0de; color:#fff; cursor:not-allowed;}
  button.ghost{background:transparent;}
  button.ghost:disabled{opacity:.4; cursor:not-allowed;}

  .kicker{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--navy);
  }
  .lead{font-size:16.5px; line-height:1.7;}
  .small-note{margin-top:14px; font-size:13.5px; color:var(--muted); line-height:1.55;}

  .board{
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.08), transparent 42%),
      radial-gradient(80% 70% at 100% 100%, rgba(0,0,0,.18), transparent 46%),
      linear-gradient(165deg, #215743, var(--board) 42%, var(--board-2));
    color:var(--cream);
    border-radius:20px;
    padding:32px 30px 26px;
    display:flex;
    flex-direction:column;
    min-height:0;
    box-shadow:inset 0 0 0 1px rgba(243,236,223,.16), inset 0 -48px 80px rgba(0,0,0,.12);
  }
  .board-kicker{color:rgba(243,236,223,.72); letter-spacing:.12em;}
  .board h1{
    margin-top:14px;
    font-family:var(--serif);
    font-weight:800;
    font-size:clamp(34px, 4vw, 52px);
    line-height:1.28;
    letter-spacing:-.03em;
  }
  .board-lead{
    margin-top:16px;
    max-width:16em;
    font-size:15.5px;
    line-height:1.65;
    color:rgba(243,236,223,.86);
  }
  .board-foot{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .fact{
    background:rgba(255,255,255,.08);
    border-radius:14px;
    padding:12px 12px 11px;
  }
  .fact b{
    display:block;
    font-size:22px;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .fact span{display:block; margin-top:2px; font-size:12px; color:rgba(243,236,223,.72);}
  .chalk{width:min(100%,280px); margin-top:auto; margin-bottom:18px; display:block;}
  .giant-quote{
    margin:auto 0 0;
    font-family:var(--serif);
    font-size:148px;
    line-height:.72;
    color:rgba(243,236,223,.28);
  }

  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    min-height:0;
    min-width:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .form-panel,.write-panel,.prose{padding:22px 22px 18px; display:flex; flex-direction:column; gap:14px;}
  .form-panel h2,.write-panel h2,.prose h2{
    font-size:22px;
    letter-spacing:-.03em;
    line-height:1.4;
  }
  .form-stack{display:flex; flex-direction:column; gap:12px; flex:1; min-height:0;}
  .form-note{
    margin-top:auto;
    background:var(--sheet);
    border-radius:14px;
    padding:14px 16px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }
  .form-note.is-error{color:var(--coral);}
  .code-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .code-actions button{flex:1;}
  .admin-list{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px;}
  .admin-list b{font-variant-numeric:tabular-nums;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label,.field > span{font-size:13px; font-weight:650; color:var(--muted);}
  .field input[type=text], .field input[type=number], .answer-well input, textarea{
    width:100%;
    border:1px solid var(--line-strong);
    background:var(--white);
    border-radius:12px;
    padding:12px 14px;
    font-size:16px;
    line-height:1.5;
    outline:none;
  }
  .field input[type=text]{min-height:48px;}
  textarea{resize:none; min-height:140px;}
  .field input[type=text]:focus, .answer-well input:focus, textarea:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 4px rgba(27,51,82,.12);
  }
  .write-panel textarea{flex:1; min-height:180px;}

  .screen-split{
    display:grid;
    grid-template-columns:minmax(280px,.94fr) 1.06fr;
    gap:16px;
  }
  .screen-split > *{min-height:0;}

  .lesson-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:16px;
  }
  .lesson-grid > *{min-height:0;}
  .prose{overflow:auto; justify-content:flex-start;}
  .prose .lead{color:var(--ink);}

  .screen-quiz,.screen-scale{gap:14px;}
  .quiz-head{flex:none; padding:6px 6px 0;}
  .question{
    margin-top:8px;
    font-size:clamp(22px, 2.4vw, 30px);
    line-height:1.45;
    letter-spacing:-.03em;
    font-weight:700;
  }
  .options{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    flex:1 1 0;
    min-height:56px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    border-radius:14px;
    background:var(--white);
    border:1px solid var(--line-strong);
    cursor:pointer;
    font-size:17px;
    line-height:1.45;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:rgba(27,51,82,.4);}
  .opt.selected{
    border-color:var(--navy);
    background:var(--navy-soft);
    box-shadow:inset 3px 0 0 var(--navy);
  }
  .opt.is-wrong{
    border-color:var(--coral);
    background:var(--coral-soft);
    box-shadow:inset 3px 0 0 var(--coral);
  }
  .letter{
    width:32px; height:32px; flex:none;
    display:grid; place-items:center;
    border-radius:50%;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
  }
  .opt.selected .letter{background:var(--navy); color:#fff; border-color:var(--navy);}
  .opt.is-wrong .letter{background:var(--coral); color:#fff; border-color:var(--coral);}

  .answer-well{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:36px 28px;
    text-align:center;
  }
  .answer-well input{
    flex:none;
    width:min(640px,100%);
    font-size:32px;
    text-align:center;
    letter-spacing:-.03em;
    min-height:76px;
    border-radius:16px;
  }

  .screen-message{min-height:0;}
  .message-panel{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    padding:42px 48px;
  }
  .goal-layout{
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:54px;
    text-align:left;
  }
  .goal-num{flex:none; min-width:180px;}
  .goal-num strong{
    display:block;
    font-family:var(--serif);
    font-weight:800;
    font-size:120px;
    line-height:.82;
    letter-spacing:-.04em;
    color:var(--navy);
  }
  .goal-num span{
    display:block;
    margin-top:10px;
    font-size:18px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .goal-copy{max-width:520px;}
  .goal-copy .lead{font-size:22px; line-height:1.6; letter-spacing:-.02em;}
  .message-panel.is-alert{align-items:center; text-align:center;}
  .message-panel .big{
    max-width:11em;
    font-family:var(--serif);
    font-weight:800;
    font-size:clamp(32px, 4vw, 48px);
    line-height:1.45;
    letter-spacing:-.03em;
    color:var(--coral);
  }
  .message-panel.is-alert .kicker{margin-bottom:18px;}

  .quote{
    flex:none;
    max-height:92px;
    overflow:auto;
    background:var(--navy-soft);
    border-radius:16px;
    padding:14px 16px;
    line-height:1.55;
  }
  .scale-list{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .likert-row{
    flex:1;
    min-height:84px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 16px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
  }
  .likert-sentence{flex:1; font-size:16px; line-height:1.5;}
  .likert-scale{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
  .scale-btn{
    position:relative;
    width:86px;
    min-height:64px;
    border-radius:14px;
    border:1px solid var(--line-strong);
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
  }
  .scale-btn input{position:absolute; opacity:0; pointer-events:none;}
  .scale-btn .n{font-size:16px; font-weight:750; color:var(--navy);}
  .scale-btn small{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:-.03em;}
  .scale-btn:hover{border-color:rgba(27,51,82,.45);}
  .scale-btn:has(input:checked){background:var(--navy); border-color:var(--navy);}
  .scale-btn:has(input:checked) .n,
  .scale-btn:has(input:checked) small{color:#fff;}

  .choice-buttons{display:grid; grid-template-rows:1fr 1fr; gap:12px;}
  .choice-tile{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:8px;
    text-align:left;
    padding:26px 26px;
    border-radius:18px;
  }
  .choice-tile strong{font-size:22px; letter-spacing:-.03em; line-height:1.35;}
  .choice-tile span{font-size:14.5px; font-weight:500; line-height:1.5;}
  .choice-tile.primary span{color:rgba(255,255,255,.78);}
  .choice-tile.ghost{background:var(--white);}
  .choice-tile.ghost span{color:var(--muted);}

  .banner{
    flex:none;
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin-bottom:12px;
    padding:10px 12px;
    border-radius:14px;
    background:var(--navy-soft);
    max-height:78px;
    overflow:auto;
  }
  .banner .tag{
    flex:none;
    font-size:11px;
    font-weight:750;
    color:var(--navy);
    background:#fff;
    border-radius:999px;
    padding:4px 8px;
  }
  .banner p{font-size:13.5px; line-height:1.5; color:#24344d;}

  .tag-pill{
    display:inline-flex;
    align-items:center;
    margin-left:8px;
    padding:3px 8px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    vertical-align:middle;
  }
  .tag-pill.wrong{background:var(--coral-soft); color:var(--coral);}
  .tag-pill.correct{background:var(--moss-soft); color:var(--moss);}
  .answer-compare{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .compare{
    border-radius:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    padding:28px;
  }
  .compare span{font-size:13px; font-weight:700;}
  .compare strong{font-size:clamp(28px, 3vw, 40px); letter-spacing:-.03em; line-height:1.2; word-break:break-word;}
  .compare.wrong{background:var(--coral-soft); color:var(--coral);}
  .compare.correct{background:var(--moss-soft); color:var(--moss);}

  .screen-end .board{flex:1;}
  .board-end{align-items:center; text-align:center;}
  .board-end .board-copy{margin:auto 0; display:flex; flex-direction:column; align-items:center;}
  .board-end .board-lead{margin-left:auto; margin-right:auto;}
  .board-end h1{font-size:clamp(40px, 5vw, 64px);}
  .books{display:flex; align-items:flex-end; gap:7px; margin-top:8px;}
  .books i{
    display:block;
    width:26px;
    border-radius:3px 3px 1px 1px;
    box-shadow:inset -7px 0 rgba(0,0,0,.08);
  }

  .screen-media{gap:14px;}
  .media-frame{
    flex:1;
    min-height:220px;
    border-radius:18px;
    overflow:hidden;
    background:#141c19;
    display:grid;
    place-items:center;
    color:rgba(243,236,223,.8);
  }
  .media-frame img,.media-frame video,.media-frame iframe{width:100%; height:100%; object-fit:cover; border:0;}

  .stage.is-end .stage-head{display:none;}
  .stage.is-end .stage-body{padding:16px;}

  .gender{display:flex; gap:8px;}
  .gender-btn{flex:1;}
  .gender-btn.selected{background:var(--navy); color:#fff; border-color:var(--navy);}

  .read-body p+p{margin-top:14px;}
  .ideas{display:flex; flex-direction:column; gap:8px; flex:1; min-height:0;}
  .idea{
    flex:1; display:flex; gap:12px; align-items:center;
    background:var(--sheet); border-radius:14px; padding:10px 14px;
    line-height:1.5;
  }
  .idea b{
    width:28px; height:28px; flex:none; border-radius:50%;
    display:grid; place-items:center; background:var(--navy); color:#fff; font-size:13px;
  }
  .screen-stories{gap:12px;}
  .story-grid{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .story{padding:22px; display:flex; flex-direction:column; gap:12px; overflow:auto;}
  .story h2{font-size:22px; letter-spacing:-.03em;}
  .said{margin-top:auto; background:var(--sheet); border-radius:14px; padding:14px 16px; line-height:1.65;}
  .prompts{margin:8px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:6px;}
  .prompts li{line-height:1.55;}
  .stem{font-size:20px; font-weight:750; letter-spacing:-.03em; line-height:1.45;}
  .memo{
    align-self:flex-start; max-width:min(520px,100%);
    display:flex; gap:10px; align-items:flex-start;
    margin-bottom:12px; padding:10px 12px; border-radius:14px; background:var(--navy-soft);
  }
  .memo .tag{flex:none; font-size:11px; font-weight:750; color:var(--navy); background:#fff; border-radius:999px; padding:4px 8px;}
  .memo p{font-size:14.5px; line-height:1.5;}

  .scale-page{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px;}
  .likert6{
    flex:1; min-height:72px; display:flex; flex-direction:column; justify-content:center; gap:8px;
    background:var(--white); border:1px solid var(--line); border-radius:16px; padding:12px 16px;
  }
  .likert6 p{font-size:15.5px; line-height:1.45;}
  .scale-block{width:min(440px,100%); margin:0 auto;}
  .dots{display:flex; justify-content:space-between; gap:6px;}
  .dot{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line-strong);

function bookRow(){

}
function escapeHtml(str){
  const d = document.createElement("div");
  d.innerText = str == null ? "" : String(str);
  return d.innerHTML;
}
function normAnswer(s){
  return String(s||"").trim().toLowerCase().replace(/[\s,]/g,"").replace(/개|cm³|cm3|㎤|세제곱센티미터/g,"");
}
function grade(problem, saved){
  if(!saved) return null;
  if(problem.kind==="mc"){
    if(problem.answerIndex==null || saved.selected==null) return null;
    return saved.selected === problem.answerIndex;
  }
  if(problem.answer==null) return null;
  if(!String(saved.value||"").trim()) return null;
  return normAnswer(saved.value) === normAnswer(problem.answer);
}
function sentenceStem(){
  const page = PAGES.find(p=>p.type==="sentence");
  return page ? page.stem : "";
}
function formatClock(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}
function dwellLeft(page){
  if(!page?.dwell) return 0;
  const saved = state.dwellMs[page.id] || 0;
  const live = Date.now() - pageEnteredAt;
  return Math.max(0, CONFIG.DWELL_MS - saved - live);
}

function renderChrome(current, total, title){
  const pct = total ? Math.max(4, Math.round(current/total*100)) : 0;
  headEl.innerHTML = `
    <div class="stage-head-row">

      </div>

    </div>
    <div class="track"><span style="width:${pct}%"></span></div>`;
}

function memoHtml(page){
  if(!page?.memo || !state.sentence.trim()) return "";
  return `<aside class="memo"><span class="tag">내가 쓴 문장</span><p>${escapeHtml(sentenceStem())} ${escapeHtml(state.sentence.trim())}</p></aside>`;

function figureHtml(file){

}

function closeModal(){ modalRoot.innerHTML = ""; }

function render(){
  clearInterval(dwellTimer);
  closeModal();
  stageEl.classList.remove("is-end");
  if(!state.group){ renderCode(); return; }
  if(retryMode){ renderRetry(); return; }
  if(state.submitted){ renderSubmitScreen(); return; }
  const page = PAGES[currentPage];
  stageEl.dataset.screen = page.type;
  renderChrome(currentPage+1, PAGES.length, page.label);
  let html = memoHtml(page);
  switch(page.type){
    case "info": html += renderInfo(); break;
    case "read": html += renderRead(page); break;
    case "expert": html += renderExpert(page); break;
    case "stories": html += renderStories(page); break;
    case "summary": html += renderSummary(page); break;
    case "sentence": html += renderSentence(page); break;
    case "scale": html += renderScale(page); break;
    case "goal": html += renderGoal(); break;
    case "problem": html += renderProblem(page.data, state.math[page.data.id], false); break;
    case "finish": html += renderFinish(); break;
  }
  appEl.innerHTML = html;
  attachPageEvents(page);
  renderNav(page);
}

function dwellSeconds(){
  return Math.round(CONFIG.DWELL_MS / 1000);
}
function dwellLabel(){
  const sec = dwellSeconds();
  if(sec > 0 && sec % 60 === 0) return `${sec / 60}분`;
  return `${sec}초`;
}
function loadCodes(){
  try{
    const raw = localStorage.getItem(CODE_STORE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    const exp = data && String(data.exp || "").trim();
    const ctrl = data && String(data.ctrl || "").trim();
    if(exp && ctrl && exp !== ctrl){
      CONFIG.CODES.exp = exp;
      CONFIG.CODES.ctrl = ctrl;
    }
  }catch(e){}
}
function loadDwell(){
  try{
    const raw = localStorage.getItem(DWELL_STORE_KEY);
    if(raw == null || raw === "") return;
    applyDwell(Number(raw), false);
  }catch(e){}
}
function applyDwell(sec, persist){
  if(!Number.isInteger(sec) || sec < 1 || sec > CONFIG.DWELL_MAX_SEC) return false;
  CONFIG.DWELL_MS = sec * 1000;
  if(persist){
    try{ localStorage.setItem(DWELL_STORE_KEY, String(sec)); }catch(e){}
  }
  return true;
}

function renderRetry(){
  const item = retryList[retryIndex];
  if(retryStampIndex !== retryIndex){
    retryStampIndex = retryIndex;
    retryEnteredAt = Date.now();
  }
  stageEl.dataset.screen = "retry";
  renderChrome(retryIndex+1, retryList.length, "다시 풀기");
  const draft = item.kind==="mc"
    ? { selected: state._retryPick ? state._retryPick[item.id] : null }
    : { value: retryDraft[item.id] || "" };
  appEl.innerHTML = memoHtml({ memo:true }) + renderProblem(item, draft, false);
  navEl.innerHTML = `
    <div class="navbar-inner">
      <button type="button" class="ghost" id="navPrev" ${retryIndex===0?"disabled":""}>이전</button>
      <div class="spacer"></div>
      <p class="nav-hint" id="navHint"></p>
      <button type="button" class="primary" id="navCheck">확인</button>
    </div>`;
  document.querySelectorAll(".opt").forEach(opt=>{
    opt.onclick = ()=>{
      retryDraft[item.id] = null;
      state._retryPick = state._retryPick || {};
      state._retryPick[item.id] = parseInt(opt.dataset.idx, 10);
      document.querySelectorAll(".opt").forEach(el=>el.classList.toggle("selected", el===opt));
    };
  });
  const input = document.getElementById("f_answer");
  if(input){
    input.oninput = ()=>{ retryDraft[item.id] = input.value; };
  }
  document.getElementById("navPrev").onclick = ()=>{
    if(retryIndex===0) return;
    retryIndex--;
    render();
  };
  document.getElementById("navCheck").onclick = ()=>checkRetry(item);
}

function currentRetryAnswer(item){
  if(item.kind==="mc") return state._retryPick ? state._retryPick[item.id] : null;
  return retryDraft[item.id] || "";
}

function checkRetry(item){
  const picked = item.kind==="mc" ? (state._retryPick && state._retryPick[item.id]) : null;
  const value = item.kind==="short" ? (retryDraft[item.id]||"") : "";
  const has = item.kind==="mc" ? picked!=null && !Number.isNaN(picked) : String(value).trim().length>0;
  const hint = document.getElementById("navHint");
  if(!has){
    if(hint) hint.textContent = "답을 입력한 뒤 확인해 주세요.";
    return;
  }
  const saved = item.kind==="mc" ? { selected:picked } : { value };
  const ok = grade(item, saved);
  const log = state.retryLog[item.id] || { back:0, skip:0, correct:false, responses:[] };
  log.responses.push({ ...saved, isCorrect: ok, at: new Date().toISOString(), ms: Date.now()-retryEnteredAt });
  state.retryLog[item.id] = log;
  if(ok===true){
    log.correct = true;
    openModal(true, item.id);
  } else if(ok===false){
    openModal(false, item.id);
  } else {
    advanceRetry();
  }
}

function openModal(correct, problemId){
  modalRoot.innerHTML = correct ? `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true">
        <p class="msg">정답입니다.</p>
        <div class="modal-actions end">
          <button type="button" class="primary" id="btnModalNext">다음</button>
        </div>
      </div>
    </div>` : `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true">
        <p class="msg">정답이 아닙니다.</p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnModalBack">문제로 돌아가기</button>
          <button type="button" class="primary" id="btnModalSkip">건너뛰기</button>
        </div>
      </div>
    </div>`;
  if(correct){
    document.getElementById("btnModalNext").onclick = ()=>advanceRetry();
  } else {
    document.getElementById("btnModalBack").onclick = ()=>{
      state.retryLog[problemId].back = 1;
      closeModal();
    };
    document.getElementById("btnModalSkip").onclick = ()=>{
      state.retryLog[problemId].skip = 1;
      advanceRetry();
    };
  }
}

function advanceRetry(){
  closeModal();
  if(retryIndex < retryList.length-1){
    retryIndex++;
    render();
  } else {
    retryMode = false;
    currentPage = PAGES.findIndex(p=>p.type==="finish");
    pageEnteredAt = Date.now();
    render();
  }
}

function startRetry(){
  state.didRetry = true;
  retryList = PROBLEMS.filter(p=>grade(p, state.math[p.id])===false);
  if(!retryList.length){
    modalRoot.innerHTML = `
      <div class="modal-back"><div class="modal" role="dialog" aria-modal="true">
        <p class="msg">다시 풀 틀린 문제가 없습니다.</p>
        <div class="modal-actions end"><button type="button" class="primary" id="btnNoRetry">알겠습니다</button></div>
      </div></div>`;
    document.getElementById("btnNoRetry").onclick = closeModal;
    return;
  }
  retryMode = true;
  retryIndex = 0;
  retryDraft = {};
  state._retryPick = {};
  retryStampIndex = -1;
  render();
}

function attachPageEvents(page){
  if(page.type==="info"){
    ["school","grade","classroom","name"].forEach(key=>{
      const el = document.getElementById("f_"+key);
      el.oninput = ()=>{ state.studentInfo[key] = el.value; updateNavValidity(); };
    });
    document.querySelectorAll(".gender-btn").forEach(btn=>{
      btn.onclick = ()=>{
        state.studentInfo.gender = btn.dataset.g;
        document.querySelectorAll(".gender-btn").forEach(b=>b.classList.toggle("selected", b===btn));
        updateNavValidity();
      };
    });
  }
  if(page.type==="summary"){
    const el = document.getElementById("f_summary");
    el.oninput = ()=>{ state.summary = el.value; updateNavValidity(); };
  }
  if(page.type==="sentence"){
    const el = document.getElementById("f_sentence");
    el.oninput = ()=>{ state.sentence = el.value; updateNavValidity(); };
  }
  if(page.type==="scale"){
    document.querySelectorAll(".dot").forEach(dot=>{
      dot.onclick = ()=>{
        const id = dot.dataset.scale;
        state.scales[id] = parseInt(dot.dataset.v, 10);
        dot.parentElement.querySelectorAll(".dot").forEach(d=>d.classList.toggle("selected", d===dot));
        updateNavValidity();
      };
    });
  }
  if(page.type==="problem"){
    const item = page.data;
    document.querySelectorAll(".opt").forEach(opt=>{
      opt.onclick = ()=>{
        const idx = parseInt(opt.dataset.idx, 10);
        const prev = state.math[item.id] || {};
        state.math[item.id] = { ...prev, selected: idx, isCorrect: item.answerIndex==null ? null : idx===item.answerIndex };
        document.querySelectorAll(".opt").forEach(el=>el.classList.toggle("selected", el===opt));
        updateNavValidity();
      };
    });
    const input = document.getElementById("f_answer");
    if(input){
      input.oninput = ()=>{
        const prev = state.math[item.id] || {};
        const value = input.value;
        state.math[item.id] = { ...prev, value, isCorrect: grade(item, { value }) };
        updateNavValidity();
      };
    }
  }
  if(page.type==="finish"){
    document.getElementById("btnRetry").onclick = startRetry;
    document.getElementById("btnEnd").onclick = finishActivity;
  }
}

function isCurrentPageValid(){
  const page = PAGES[currentPage];
  if(!page) return true;
  switch(page.type){
    case "info": {
      const s = state.studentInfo;
      return s.school.trim() && s.grade.trim() && s.classroom.trim() && s.name.trim() && s.gender;
    }
    case "summary": return state.summary.trim().length>0;
    case "sentence": return state.sentence.trim().length>0;
    case "scale": return page.items.every(item=>state.scales[item.id]);
    case "problem": {
      const saved = state.math[page.data.id];
      if(!saved) return false;
      if(page.data.kind==="mc") return saved.selected!=null;
      return String(saved.value||"").trim().length>0;
    }
    default: return true;
  }
}

function updateNavValidity(){
  const nextBtn = document.getElementById("navNext");
  const hint = document.getElementById("navHint");
  if(!nextBtn) return;
  const ok = isCurrentPageValid();
  nextBtn.classList.toggle("is-waiting", !ok);
  nextBtn.setAttribute("aria-disabled", ok ? "false" : "true");
  if(hint) hint.textContent = (showHint && !ok) ? "계속하려면 모든 항목에 응답해 주세요." : "";
}

function renderNav(page){
  clearInterval(dwellTimer);
  const hidePrev = currentPage===0 && state.groupLocked;
  const hideNext = page.type==="finish";
  const locked = page.dwell && dwellLeft(page)>0;
  navEl.innerHTML = `
    <div class="navbar-inner">
      ${hidePrev ? "" : `<button type="button" class="ghost" id="navPrev">이전</button>`}
      <div class="spacer"></div>
      <p class="nav-hint" id="navHint"></p>
      ${locked ? `<span class="timer-pill" id="dwellClock">${formatClock(dwellLeft(page))}</span>` : (hideNext ? "" : `<button type="button" class="primary" id="navNext">다음</button>`)}
    </div>`;
  if(!hidePrev){
    document.getElementById("navPrev").onclick = ()=>{
      if(currentPage===0){
        commitPageTime();
        state.group = null;
        render();
        return;
      }
      commitPageTime();
      showHint = false;
      currentPage--;
      render();
    };
  }
  if(!locked && !hideNext){
    document.getElementById("navNext").onclick = ()=>{
      if(!isCurrentPageValid()){
        showHint = true;
        updateNavValidity();
        return;
      }
      showHint = false;
      commitPageTime();
      if(currentPage < PAGES.length-1) currentPage++;
      render();
    };
    updateNavValidity();
  }
  if(locked){
    dwellTimer = setInterval(()=>{
      const left = dwellLeft(PAGES[currentPage]);
      const clock = document.getElementById("dwellClock");
      if(!clock){ clearInterval(dwellTimer); return; }
      if(left<=0){
        clearInterval(dwellTimer);
        renderNav(PAGES[currentPage]);
      } else {
        clock.textContent = formatClock(left);
      }
    }, 250);
  }
}

function commitPageTime(){
  const page = PAGES[currentPage];
  if(!page) return;
  const elapsed = Date.now()-pageEnteredAt;
  state.pageMs[page.id] = (state.pageMs[page.id]||0) + elapsed;
  if(page.dwell) state.dwellMs[page.id] = (state.dwellMs[page.id]||0) + elapsed;
  if(page.type==="problem"){
    const prev = state.math[page.data.id] || {};
    state.math[page.data.id] = { ...prev, responseTimeMs:(prev.responseTimeMs||0)+elapsed };
  }
  pageEnteredAt = Date.now();
}

function secOf(ms){
  if(ms==null || !Number.isFinite(Number(ms))) return "";
  return Math.round(Number(ms)/10)/100;
}
function pageSec(ids){
  let total = 0;
  let any = false;
  ids.forEach(id=>{
    const ms = state.pageMs[id];
    if(ms){ total += ms; any = true; }
  });
  return any ? secOf(total) : "";
}
function countChars(s){
  return [...String(s||"").trim()].length;
}
function countWords(s){
  const t = String(s||"").trim();
  return t ? t.split(/\s+/).length : 0;
}
function scaleMean(items){
  const vals = items.map(it=>state.scales[it.id]).filter(v=>Number.isFinite(v));
  if(!vals.length) return "";
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100;
}
function answerText(problem, saved){
  if(!saved) return "";
  if(problem.kind==="mc"){
    if(saved.selected==null || Number.isNaN(saved.selected)) return "";
    return problem.options[saved.selected] || "";
  }
  return String(saved.value||"").trim();
}
function choiceNo(problem, saved){
  if(!problem || problem.kind!=="mc" || !saved || saved.selected==null || Number.isNaN(saved.selected)) return "";
  return saved.selected + 1;
}
function markBit(v){
  if(v===true) return 1;
  if(v===false) return 0;
  return "";
}

function buildColumns(){
  const cols = [];
  const add = (name, value)=>cols.push([name, value==null ? "" : value]);
  const info = state.studentInfo;
  const behavior = [...POST_B, ...POST_C];
  add("제출시각", new Date().toISOString());
  add("집단", state.group==="exp" ? 1 : (state.group==="ctrl" ? 0 : ""));
  add("집단명", state.group==="exp" ? "실험" : (state.group==="ctrl" ? "통제" : ""));
  add("학교", info.school.trim());
  add("학년", info.grade.trim());
  add("반", info.classroom.trim());
  add("이름", info.name.trim());
  add("성별", info.gender || "");
  add("성별코드", info.gender==="남자" ? 1 : (info.gender==="여자" ? 2 : ""));
  add("요약", state.summary.trim());
  add("요약_글자수", countChars(state.summary));
  add("요약_어절수", countWords(state.summary));
  add("기억문장", state.sentence.trim());
  add("기억문장_글자수", countChars(state.sentence));
  add("기억문장_어절수", countWords(state.sentence));
  CHECK_ITEMS.forEach((it,i)=>add("조작점검"+(i+1), state.scales[it.id] ?? ""));
  add("조작점검_응답수", CHECK_ITEMS.filter(it=>Number.isFinite(state.scales[it.id])).length);
  add("조작점검_평균", scaleMean(CHECK_ITEMS));
  POST_A.forEach((it,i)=>add("사후적응"+(i+1), state.scales[it.id] ?? ""));
  add("사후적응_평균", scaleMean(POST_A));
  behavior.forEach((it,i)=>add("사후행동"+(i+1), state.scales[it.id] ?? ""));
  add("사후행동_평균", scaleMean(behavior));

  let scored = 0, firstCorrect = 0, firstWrong = 0, unscored = 0;
  let retryItems = 0, retryCorrect = 0, backSum = 0, skipSum = 0, finalCorrect = 0;
  PROBLEMS.forEach(p=>{
    const tag = "문제"+String(p.no).padStart(2,"0");
    const saved = state.math[p.id] || {};
    const has = p.kind==="mc"
      ? saved.selected!=null && !Number.isNaN(saved.selected)
      : String(saved.value||"").trim().length>0;
    const ok = has ? grade(p, saved) : null;
    const log = state.retryLog[p.id];
    const responses = log && log.responses ? log.responses : [];
    const last = responses.length ? responses[responses.length-1] : null;
    add(tag+"_응답", answerText(p, saved));
    add(tag+"_선택", choiceNo(p, saved));
    add(tag+"_정오", markBit(ok));
    add(tag+"_풀이초", has ? secOf(saved.responseTimeMs||0) : "");
    add(tag+"_재시도횟수", log ? responses.length : "");
    if(last){
      const retrySaved = p.kind==="mc" ? { selected:last.selected } : { value:last.value||"" };
      add(tag+"_재시도응답", answerText(p, retrySaved));
      add(tag+"_재시도정오", markBit(last.isCorrect));
    }else{
      add(tag+"_재시도응답", "");
      add(tag+"_재시도정오", "");
    }
    add(tag+"_재시도_돌아가기", log ? (log.back ? 1 : 0) : "");
    add(tag+"_재시도_건너뛰기", log ? (log.skip ? 1 : 0) : "");

    const keyed = p.kind==="mc" ? p.answerIndex!=null : p.answer!=null;
    if(!keyed) unscored++;
    else{
      scored++;
      if(ok===true) firstCorrect++;
      else if(ok===false) firstWrong++;
      if(ok===true || (last && last.isCorrect===true)) finalCorrect++;
    }
    if(log){
      retryItems++;
      if(last && last.isCorrect===true) retryCorrect++;
      backSum += log.back ? 1 : 0;
      skipSum += log.skip ? 1 : 0;
    }
  });

  add("채점문항수", scored);
  add("최초정답수", firstCorrect);
  add("최초오답수", firstWrong);
  add("미채점문항수", unscored);
  add("최초정답률", scored ? Math.round(firstCorrect/scored*10000)/100 : "");
  add("다시풀기실시", state.didRetry ? 1 : 0);
  add("재시도문항수", retryItems);
  add("재시도정답수", retryCorrect);
  add("재시도_돌아가기합", backSum);
  add("재시도_건너뛰기합", skipSum);
  add("재시도후정답수", finalCorrect);
  add("재시도후정답률", scored ? Math.round(finalCorrect/scored*10000)/100 : "");
  add("목표기준", CONFIG.PASS_THRESHOLD);
  add("목표도달", firstCorrect >= CONFIG.PASS_THRESHOLD ? 1 : 0);
  add("체류초_정보", pageSec(["info"]));
  add("체류초_읽기", pageSec(["exp-read","ctrl-read"]));
  add("체류초_전문가", pageSec(["exp-expert","ctrl-expert"]));
  add("체류초_이야기", pageSec(["exp-stories","ctrl-stories"]));
  add("체류초_요약", pageSec(["exp-summary","ctrl-summary"]));
  add("체류초_한문장", pageSec(["exp-sentence","ctrl-sentence"]));
  add("체류초_조작점검", pageSec(["check"]));
  add("체류초_목표", pageSec(["goal"]));
  add("체류초_사후1", pageSec(["post1"]));
  add("체류초_사후2", pageSec(["post2"]));
  add("체류초_사후3", pageSec(["post3"]));
  add("체류초_마무리", pageSec(["finish"]));
  add("체류초_글합계", pageSec(["exp-read","ctrl-read","exp-expert","ctrl-expert","exp-stories","ctrl-stories","exp-summary","ctrl-summary","exp-sentence","ctrl-sentence","check"]));
  add("전체소요초", state.startedAt ? secOf(Date.now()-state.startedAt) : "");
  return cols;
}

function buildPayload(){
  const cols = buildColumns();
  return {
    headers: cols.map(col=>col[0]),
    values: cols.map(col=>col[1])
  };
}

function finishActivity(){
  if(state.submitted) return;
  if(!retryMode) commitPageTime();
  retryMode = false;
  closeModal();
  const payload = buildPayload();
  state.submitted = true;
  render();
  if(!CONFIG.GAS_ENDPOINT) return;
  fetch(CONFIG.GAS_ENDPOINT, {
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(()=>console.log("Google Sheets 전송 요청 완료"))
    .catch(err=>console.error("Google Sheets 전송 실패:", err));
}

window.addEventListener("beforeunload", (e)=>{
  if(state.group && !state.submitted){
    e.preventDefault();
    e.returnValue = "";
  }
});

loadCodes();
loadDwell();
render();

</script>
